# Packaging (step 9). Deliberately small: this is a prototype that has to be
# runnable by someone who is not going to install a toolchain, not a signed
# product. Nothing here is notarised or signed — `identity: null` says so out
# loud rather than letting a half-configured signature fail the build.

appId: dev.cocoa.electron
productName: cocoa
copyright: cocoa

directories:
  # electron-vite writes here; `build/` holds the icon electron-builder reads.
  output: release
  buildResources: build

# The renderer, the preload and the main bundle, plus the two runtime
# dependencies the engine actually loads (nunjucks renders templates,
# smol-toml reads manifests). Everything else in node_modules is a build tool.
files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Unsigned on purpose: a signature needs a certificate this prototype has no
  # business carrying. Gatekeeper will ask; that is the honest state of it.
  identity: null

linux:
  category: Development
  # The command is `cocoa`, not the package name: without this the binary is
  # `cocoa-electron`, which is the repository's name for the folder, not the
  # app's name for itself.
  executableName: cocoa
  # Names the installed `.desktop` after the executable, so it matches
  # `StartupWMClass` and Electron's app_id. Without that a running window is not
  # linked to its launcher and the desktop shows a generic icon instead of ours.
  syncDesktopName: true
  target: [AppImage]

win:
  target: [nsis]
