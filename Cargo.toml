[package]
name = "experiment_manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
egui = "=0.36.1"
eframe = { version = "=0.36.1", features = ["persistence"] }
egui_extras = "=0.36.1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# Only the `screenshot` example needs a PNG encoder; eframe already builds it.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
