[package]
name = "coco"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
egui = "=0.36.1"
eframe = { version = "=0.36.1", features = ["persistence"] }
egui_extras = "=0.36.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
minijinja = { version = "=2.24.0", features = ["unstable_machinery", "loop_controls"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
log = "0.4"
rfd = "0.17.2"
tiny_http = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# The agent interface (§43) as an MCP server: an agent's MCP client launches
# this and speaks stdio; each tool call becomes one request over the socket.
[[bin]]
name = "coco-mcp-server"
path = "src/bin/coco_mcp_server.rs"

# Only the `screenshot` example needs a PNG encoder; eframe already builds it.
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
