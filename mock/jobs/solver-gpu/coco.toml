kind        = "job"
name        = "solver-gpu"
description = "Mock GPU solver — healthy ~30 s lifecycle"

[render]
template    = "job.sbatch.tmpl"

[[render.params]]
name        = "nodes"
type        = "string"
description = "Nodes to request"

[launch]
command     = "./launch.sh"

[[launch.params]]
name        = "gpu"
type        = "string"
description = "Which GPU to pin to"

[poll]
command     = "python3 poll.py"

[report]
command     = "python3 report.py"

[cancel]
command     = "./cancel.sh"
