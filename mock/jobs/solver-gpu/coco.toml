kind        = "job"
name        = "solver-gpu"
description = "Mock GPU solver — healthy ~30 s lifecycle"

[render]
template    = "job.sbatch.tmpl"
params      = ["nodes"]

[launch]
command     = "./launch.sh"
params      = ["gpu"]

[poll]
command     = "python3 poll.py"

[report]
command     = "python3 report.py"

[cancel]
command     = "./cancel.sh"
