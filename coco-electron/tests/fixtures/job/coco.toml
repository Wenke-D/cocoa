kind        = "job"
name        = "fixture-job"
description = "Test fixture: a job whose scripts answer from state files"

[render]
template    = "job.sbatch.tmpl"

[[render.params]]
name        = "size"
type        = "string"
description = "Nodes to request"

[launch]
command     = "./launch.sh"

[[launch.params]]
name        = "gpu"
type        = "string"
description = "Which GPU to pin to"

[poll]
command     = "./poll.sh"

[report]
command     = "./report.sh"

[cancel]
command     = "./cancel.sh"
