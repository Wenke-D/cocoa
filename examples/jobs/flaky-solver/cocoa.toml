kind        = "job"
name        = "flaky-solver"
description = "Mock solver whose poll reports UNREACHABLE between 5-10 s, then recovers"

[render]
template    = "job.sbatch.tmpl"

[[render.params]]
name        = "nodes"
type        = "string"
description = "Nodes to request"

[launch]
command     = "./launch.sh"

[[launch.params]]
name        = "gpu"
type        = "enum"
values      = ["0", "1"]
description = "Which GPU to pin to"

[[launch.params]]
name        = "backends"
type        = "enum"
values      = ["cuda", "hip"]
list        = true
description = "Backends to try, in order, until one runs"

[poll]
command     = "python3 poll.py"

[report]
command     = "python3 report.py"

[cancel]
command     = "./cancel.sh"

[check]
command     = "./check.sh"

[deploy]
command     = "./deploy.sh"
