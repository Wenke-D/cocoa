kind        = "job"
name        = "failing-solver"
description = "Mock solver that fails at 8 s when launched with mode=fail"

[render]
template    = "job.sbatch.tmpl"

[[render.params]]
name        = "nodes"
type        = "string"
description = "Nodes to request"

[launch]
command     = "./launch.sh"

[[launch.params]]
name        = "mode"
type        = "enum"
values      = ["ok", "fail"]
description = "`fail` makes the run fail at 8 s; `ok` lets it finish"

[[launch.params]]
name        = "profile"
type        = "enum"
values      = ["true", "false"]
description = "Run under the profiler"

[[launch.params]]
name        = "tags"
type        = "string"
list        = true
description = "Tags for the report, one per line"

[poll]
command     = "python3 poll.py"

[report]
command     = "python3 report.py"

[cancel]
command     = "./cancel.sh"

[check]
command     = "./check.sh"

[deploy]
command     = "./deploy.sh"
